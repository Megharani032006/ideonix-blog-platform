{% extends "base.html" %}
{% block title %}Log in · Ideonix{% endblock %}
{% block content %}
<div class="form-page"><div class="form-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Continue sharing your ideas.</p>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="Your username">
    <label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Your password">
    <button class="button full-width" type="submit">Log in</button>
  </form>
  <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
